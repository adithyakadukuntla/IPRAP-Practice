[pytest]

pythonpath = . api
# Pytest configuration for IPRAP test suite

minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Markers
markers =
    api: API endpoint tests
    data: Data reconciliation and quality tests
    security: Security validation tests
    performance: Performance tests
    negative: Negative/error scenario tests
    functional: Functional tests
    integration: Integration tests
    smoke: Smoke tests (quick validation)
    regression: Regression tests
    e2e: End-to-end tests

# Test paths
testpaths = 
    tests/automation/api
    tests/automation/data

# Coverage options
[coverage:run]
source = tests
omit = 
    */tests/*/__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
